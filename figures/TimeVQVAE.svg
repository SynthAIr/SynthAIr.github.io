<svg xmlns="http://www.w3.org/2000/svg" width="620" height="660" viewBox="50 60 520 645">
  <!-- Define styles for the text elements -->
  <style>
    text { font-family: Arial, sans-serif; font-size: 12px; }
    .title { font-size: 20px; font-weight: bold; }
    .subtitle { font-size: 14px; font-weight: bold; }
    .small { font-size: 10px; }
  </style>
  

  <!-- Input Trajectory box and label -->
  <rect x="340" y="70" width="120" height="40" fill="#f0f0f0" stroke="#000" />
  <text x="400" y="88" text-anchor="middle">Input</text>
  <text x="400" y="102" text-anchor="middle">Trajectory</text>

  <!-- Conditional Input box and label -->
  <rect x="50" y="70" width="120" height="40" fill="#ffd7e8" stroke="#000" />
  <text x="110" y="88" text-anchor="middle">Conditional</text>
  <text x="110" y="102" text-anchor="middle">Input (Optional)</text>

  <!-- STFT box and label -->
  <rect x="340" y="130" width="120" height="40" fill="#e6f3ff" stroke="#000" />
  <text x="400" y="150" text-anchor="middle" class="subtitle">STFT</text>
  <text x="400" y="162" text-anchor="middle" class="small">Time-Frequency Transform</text>

  <!-- LF Encoder triangle and label -->
  <path d="M200 190 L320 190 L300 260 L220 260 Z" fill="#d1e7dd" stroke="#000" />
  <text x="260" y="207" text-anchor="middle" class="subtitle">LF Encoder</text>
  <text x="260" y="220" text-anchor="middle" class="small">Conv2d, BatchNorm2d</text>
  <text x="260" y="230" text-anchor="middle" class="small">Snake Activation</text>
  <text x="260" y="240" text-anchor="middle" class="small">ResBlocks, Dropout</text>

  <!-- HF Encoder triangle and label -->
  <path d="M480 190 L600 190 L580 260 L500 260 Z" fill="#d1e7dd" stroke="#000" />
  <text x="540" y="207" text-anchor="middle" class="subtitle">HF Encoder</text>
  <text x="540" y="220" text-anchor="middle" class="small">Conv2d, BatchNorm2d</text>
  <text x="540" y="230" text-anchor="middle" class="small">Snake Activation</text>
  <text x="540" y="240" text-anchor="middle" class="small">ResBlocks, Dropout</text>

  <!-- LF VQ box and label -->
  <rect x="220" y="280" width="80" height="40" fill="#d0f0c0" stroke="#000" />
  <text x="260" y="300" text-anchor="middle" class="subtitle">LF VQ</text>
  <text x="260" y="312" text-anchor="middle" class="small">Codebook</text>

  <!-- HF VQ box and label -->
  <rect x="500" y="280" width="80" height="40" fill="#d0f0c0" stroke="#000" />
  <text x="540" y="300" text-anchor="middle" class="subtitle">HF VQ</text>
  <text x="540" y="312" text-anchor="middle" class="small">Codebook</text>

  <!-- Latent Space box and label -->
  <rect x="210" y="330" width="380" height="60" fill="#e6e6fa" stroke="#000" />
  <text x="400" y="360" text-anchor="middle" class="subtitle">Discrete Latent Space</text>

  <!-- LF Latent box and label within Latent Space -->
  <rect x="220" y="340" width="80" height="40" fill="#cfe2ff" stroke="#000" />
  <text x="260" y="365" text-anchor="middle" class="subtitle">LF Latent</text>

  <!-- HF Latent box and label within Latent Space -->
  <rect x="500" y="340" width="80" height="40" fill="#cfe2ff" stroke="#000" />
  <text x="540" y="365" text-anchor="middle" class="subtitle">HF Latent</text>

  <!-- LF Embedding box and label with spacing -->
  <rect x="220" y="400" width="80" height="40" fill="#d0f0c0" stroke="#000" />
  <text x="260" y="420" text-anchor="middle" class="subtitle">Embedding</text>
  <text x="260" y="435" text-anchor="middle" class="small">Codebook Lookup</text>


  <!-- HF Embedding box and label with spacing -->
  <rect x="500" y="400" width="80" height="40" fill="#d0f0c0" stroke="#000" />
  <text x="540" y="420" text-anchor="middle" class="subtitle">Embedding</text>
  <text x="540" y="435" text-anchor="middle" class="small">Codebook Lookup</text>


  <!-- Prior Learning box and label -->
  <rect x="40" y="280" width="140" height="160" fill="#ffe4b5" stroke="#000" />
  <text x="110" y="300" text-anchor="middle" class="subtitle">Prior Learning</text>

  <!-- LF Prior box and label within Prior Learning -->
  <rect x="50" y="320" width="120" height="50" fill="#fff3cd" stroke="#000" />
  <text x="110" y="340" text-anchor="middle" class="subtitle">LF Prior</text>
  <text x="110" y="355" text-anchor="middle" class="small">Bidirection Transformer</text>
  <text x="110" y="365" text-anchor="middle" class="small">MaskGIT</text>

  <!-- HF Prior box and label within Prior Learning -->
  <rect x="50" y="380" width="120" height="50" fill="#fff3cd" stroke="#000" />
  <text x="110" y="400" text-anchor="middle" class="subtitle">HF Prior</text>
  <text x="110" y="415" text-anchor="middle" class="small">Bidirectional Transformer</text>
  <text x="110" y="425" text-anchor="middle" class="small">MaskGIT</text>

  <!-- LF Decoder triangle and label -->
  <path d="M220 450 L300 450 L320 520 L200 520 Z" fill="#d1e7dd" stroke="#000" />
  <text x="260" y="470" text-anchor="middle" class="subtitle">LF Decoder</text>
  <text x="260" y="485" text-anchor="middle" class="small">ConvTranspose2d</text>
  <text x="260" y="495" text-anchor="middle" class="small">BatchNorm2d</text>
  <text x="260" y="505" text-anchor="middle" class="small">Snake Activation</text>
  <text x="260" y="515" text-anchor="middle" class="small">ResBlocks, Dropout</text>

  <!-- HF Decoder triangle and label -->
  <path d="M500 450 L580 450 L600 520 L480 520 Z" fill="#d1e7dd" stroke="#000" />
  <text x="540" y="470" text-anchor="middle" class="subtitle">HF Decoder</text>
  <text x="540" y="485" text-anchor="middle" class="small">ConvTranspose2d</text>
  <text x="540" y="495" text-anchor="middle" class="small">BatchNorm2d</text>
  <text x="540" y="505" text-anchor="middle" class="small">Snake Activation</text>
  <text x="540" y="515" text-anchor="middle" class="small">ResBlocks, Dropout</text>

  <!-- Inverse STFT box and label moved up -->
  <rect x="340" y="540" width="120" height="40" fill="#e6f3ff" stroke="#000" />
  <text x="400" y="560" text-anchor="middle" class="subtitle">Inverse STFT</text>
  <text x="400" y="572" text-anchor="middle" class="small">Time Domain Conversion</text>

  <!-- Fidelity Enhancer box and label moved up -->
  <rect x="340" y="600" width="120" height="40" fill="#e0f2f1" stroke="#000" />
  <text x="400" y="620" text-anchor="middle" class="subtitle">Fidelity Enhancer</text>
  <text x="400" y="632" text-anchor="middle" class="small">UNet Refinement</text>

  <!-- Generated Trajectory box and label moved up -->
  <rect x="340" y="660" width="120" height="40" fill="#f0f0f0" stroke="#000" />
  <text x="400" y="678" text-anchor="middle">Reconstructed</text>
  <text x="400" y="692" text-anchor="middle">Trajectory</text>

  <!-- Define arrowhead marker for use in lines -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Arrow from Input Trajectory to STFT -->
  <line x1="400" y1="110" x2="400" y2="120" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrows from STFT to LF Encoder and HF Encoder -->
  <line x1="340" y1="150" x2="260" y2="150" stroke="#000" />
  <line x1="260" y1="150" x2="260" y2="190" stroke="#000" marker-end="url(#arrowhead)" />
  <line x1="460" y1="150" x2="540" y2="150" stroke="#000" />
  <line x1="540" y1="150" x2="540" y2="190" stroke="#000" marker-end="url(#arrowhead)" />
  <!-- Labels above arrows -->
  <text x="260" y="140" text-anchor="middle" class="small">Low-Frequency (LF)</text>
  <text x="540" y="140" text-anchor="middle" class="small">High-Frequency (HF)</text>

  <!-- Arrows from LF Encoder and HF Encoder to respective VQ boxes -->
  <line x1="260" y1="260" x2="260" y2="280" stroke="#000" marker-end="url(#arrowhead)" />
  <line x1="540" y1="260" x2="540" y2="280" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrows from LF VQ and HF VQ to respective Latent boxes -->
  <line x1="260" y1="320" x2="260" y2="330" stroke="#000" marker-end="url(#arrowhead)" />
  <line x1="540" y1="320" x2="540" y2="330" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrows from LF latent and HF Latent to  box Embedding boxes -->
  <line x1="260" y1="380" x2="260" y2="400" stroke="#000" marker-end="url(#arrowhead)" />
  <line x1="540" y1="380" x2="540" y2="400" stroke="#000" marker-end="url(#arrowhead)" />

  


  <!-- Arrows from Embedding boxes to respective Decoders -->
  <line x1="260" y1="440" x2="260" y2="450" stroke="#000" marker-end="url(#arrowhead)" />
  <line x1="540" y1="440" x2="540" y2="450" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrows from Decoders to Inverse STFT -->
  <line x1="260" y1="520" x2="260" y2="560" stroke="#000" />
  <line x1="260" y1="560" x2="340" y2="560" stroke="#000" marker-end="url(#arrowhead)" />
  <line x1="540" y1="520" x2="540" y2="560" stroke="#000" />
  <line x1="540" y1="560" x2="460" y2="560" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrow from Inverse STFT to Fidelity Enhancer -->
  <line x1="400" y1="580" x2="400" y2="600" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrow from Fidelity Enhancer to Reconstructed Trajectory -->
  <line x1="400" y1="640" x2="400" y2="660" stroke="#000" marker-end="url(#arrowhead)" />
  
  <!-- Arrow from Prior Learning to Latent Space -->
  <line x1="180" y1="360" x2="200" y2="360" stroke="#000" marker-end="url(#arrowhead)" />

  <!-- Arrow from Conditional Input to Prior Learning -->
  <line x1="110" y1="110" x2="110" y2="280" stroke="#000" marker-end="url(#arrowhead)" />

</svg>
