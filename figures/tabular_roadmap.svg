<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 -30 1120 370">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#6EE7B7;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:0.5" />
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="3"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L10,3.5 L1,6 L2,3.5 Z" fill="#374151"/>
    </marker>
    <!-- Arrowhead2 marker -->
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
        <path d="M0,0 L10,3.5 L0,7 L3,3.5 Z" fill="#374151" />
    </marker>
  </defs>

  <!-- Main flow containers -->
    <!-- Data Sources (highlighted) -->
    <rect x="50" y="80" width="150" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)" />
    <text x="125" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="black" font-family="Arial" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Data Sources ✅</text>

    <!-- Sub-items for Data Sources - Only Flight Operations -->
    <rect x="60" y="160" width="130" height="30" rx="5" fill="#E5E7EB" />
    <text x="125" y="180" text-anchor="middle" font-size="10" fill="#374151">EU Flight Operations</text>
    
    <!-- Subsection for Flight Operations - Only EU (OAG) -->
    <rect x="70" y="195" width="110" height="20" rx="3" fill="#F3F4F6" />
    <text x="125" y="210" text-anchor="middle" font-size="8" fill="#4B5563">OAG Flight Info Direct</text>

    <!-- AI Models -->
    <rect x="250" y="80" width="200" height="60" rx="10" fill="url(#greenGrad)" filter="url(#shadow)" />
    <text x="350" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="black" font-family="Arial" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">AI Models ✅</text>

    <!-- Tabular Models Header -->
    <text x="350" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Tabular</text>
    <rect x="285" y="170" width="130" height="25" rx="5" fill="#E5E7EB" />
    <rect x="285" y="200" width="130" height="25" rx="5" fill="#E5E7EB" />
    <rect x="285" y="230" width="130" height="25" rx="5" fill="#E5E7EB" />
    <rect x="285" y="260" width="130" height="25" rx="5" fill="#E5E7EB" />
    <text x="350" y="187" text-anchor="middle" font-size="9" fill="#374151">REaLTabFormer</text>
    <text x="350" y="217" text-anchor="middle" font-size="9" fill="#374151">TabSyn</text>
    <text x="350" y="247" text-anchor="middle" font-size="9" fill="#374151">CTGAN</text>
    <text x="350" y="277" text-anchor="middle" font-size="9" fill="#374151">GaussianCopula</text>

    <text x="350" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Privacy-preserving</text>
    <rect x="285" y="310" width="130" height="25" rx="5" fill="#E5E7EB" />
    <text x="350" y="327" text-anchor="middle" font-size="9" fill="#374151">Differential Privacy</text>

    <!-- Synthetic Data -->
    <rect x="500" y="80" width="200" height="60" rx="10" fill="url(#goldGrad)" filter="url(#shadow)" />
    <text x="600" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="black" font-family="Arial" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Synthetic Data ✅</text>

    <!-- Flight Operations with subsections -->
    <rect x="535" y="160" width="130" height="30" rx="5" fill="#E5E7EB" />
    <text x="600" y="180" text-anchor="middle" font-size="10" fill="#374151">Flight Operations</text>
    
    <!-- Subsections for Flight Operations - Only Schedules, Delay, Turnaround -->
    <rect x="545" y="195" width="110" height="20" rx="3" fill="#F3F4F6" />
    <rect x="545" y="220" width="110" height="20" rx="3" fill="#F3F4F6" />
    <rect x="545" y="245" width="110" height="20" rx="3" fill="#F3F4F6" />
    <text x="600" y="210" text-anchor="middle" font-size="8" fill="#4B5563">Schedules</text>
    <text x="600" y="235" text-anchor="middle" font-size="8" fill="#4B5563">Delay</text>
    <text x="600" y="260" text-anchor="middle" font-size="8" fill="#4B5563">Turnaround</text>
    
    <!-- Extended Validation Section -->
    <rect x="750" y="80" width="400" height="60" rx="10" fill="url(#purpleGrad)" filter="url(#shadow)" />
    <text x="950" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="black" font-family="Arial" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Validation ✅</text>

    <!-- Privacy Section (moved to left position) -->
    <rect x="760" y="160" width="120" height="25" rx="5" fill="#E8F4FD" />
    <text x="820" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Privacy</text>
    
    <!-- Privacy subsections -->
    <rect x="765" y="190" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="820" y="203" text-anchor="middle" font-size="7" fill="#4B5563">Distance to Closest Record</text>
    <rect x="765" y="212" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="820" y="225" text-anchor="middle" font-size="7" fill="#4B5563">Training/Holdout Proximity</text>

    <!-- Fidelity Section (moved to middle position) -->
    <rect x="890" y="160" width="120" height="25" rx="5" fill="#E1E7F5" />
    <text x="950" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Fidelity</text>
    
    <!-- Fidelity subsections -->
    <rect x="895" y="190" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="950" y="203" text-anchor="middle" font-size="7" fill="#4B5563">Statistical Similarity</text>
    <rect x="895" y="212" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="950" y="225" text-anchor="middle" font-size="7" fill="#4B5563">Correlation Preservation</text>
    <rect x="895" y="234" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="950" y="247" text-anchor="middle" font-size="7" fill="#4B5563">Distribution Similarity</text>
    <rect x="895" y="256" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="950" y="269" text-anchor="middle" font-size="7" fill="#4B5563">Likelihood-based</text>
    <rect x="895" y="278" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="950" y="291" text-anchor="middle" font-size="7" fill="#4B5563">Detection-based</text>

    <!-- Utility Section -->
    <rect x="1020" y="160" width="120" height="25" rx="5" fill="#F0F9F0" />
    <text x="1080" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Utility</text>
    
    <!-- Utility subsections -->
    <rect x="1025" y="190" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="1080" y="203" text-anchor="middle" font-size="7" fill="#4B5563">TSTR vs TRTR</text>
    <rect x="1025" y="212" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="1080" y="225" text-anchor="middle" font-size="7" fill="#4B5563">Pre-tactical vs Tactical Prediction</text>
    <rect x="1025" y="234" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="1080" y="247" text-anchor="middle" font-size="7" fill="#4B5563">Departure Delay Prediction</text>
    <rect x="1025" y="256" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="1080" y="269" text-anchor="middle" font-size="7" fill="#4B5563">Arrival Delay Prediction</text>
    <rect x="1025" y="278" width="110" height="18" rx="3" fill="#F3F4F6" />
    <text x="1080" y="291" text-anchor="middle" font-size="7" fill="#4B5563">Turnaround Prediction</text>

 
  <!-- Forward flow arrows -->
  <path d="M200,110 C230,110 230,110 250,110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M450,110 C480,110 480,110 500,110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"  fill="none"/>
  <path d="M700,110 C730,110 730,110 750,110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"  fill="none"/>

  <!-- Feedback loops -->
  <!-- Validation to AI Models feedback (over the top) -->
  <path d="M950,80 C950,0 350,0 350,80" 
        stroke="#374151" stroke-width="1.5" stroke-dasharray="5,5"
        marker-end="url(#arrowhead2)" fill="none"/>

  <text x="550" y="40" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial" >Model Refinement</text>

  <!-- Validation to Data Sources feedback -->
  <path d="M950,80 C950,-50 125,-50 125,80" 
        stroke="#374151" stroke-width="1.5" stroke-dasharray="5,5"
        marker-end="url(#arrowhead2)" fill="none"/>
  <text x="230" y="40" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial" >Quality Feedback</text>
  
</svg>