<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 110 1050 260">
  <rect x="60" y="60" width="1050" height="500" fill="#fff"/>

  <!-- Input label -->
  <text x="140" y="190" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#0066cc">Flight Input Data</text>

  <!-- PREPROCESSING SECTION -->
  <rect x="220" y="120" width="200" height="200" fill="#fff4e6" stroke="#cc7700" stroke-width="2" rx="8" ry="8"/>
  <text x="320" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#cc7700">Preprocessing</text>

  <!-- Mode normalization -->
  <rect x="240" y="162" width="160" height="60" fill="#ffffff" stroke="#cc7700" stroke-width="1" rx="5" ry="5"/>
  <text x="320" y="182" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Mode Normalization</text>
  <text x="320" y="200" text-anchor="middle" font-family="Arial" font-size="11">Bayesian GMM for continuous</text>
  <text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="11">features; one-hot for categorical</text>

  <!-- MLP layer -->
  <rect x="240" y="238" width="160" height="60" fill="#ffffff" stroke="#cc7700" stroke-width="1" rx="5" ry="5"/>
  <text x="320" y="258" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">MLP Encoder Layers</text>
  <text x="320" y="276" text-anchor="middle" font-family="Arial" font-size="11">Stacked linear layers with</text>
  <text x="320" y="291" text-anchor="middle" font-family="Arial" font-size="11">batch norm + ReLU activations</text>

  <!-- LATENT SPACE SECTION -->
  <rect x="450" y="120" width="220" height="200" fill="#e6f0ff" stroke="#3366cc" stroke-width="2" rx="8" ry="8"/>
  <text x="560" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#3366cc">Latent Space</text>

  <!-- mu sigma -->
  <rect x="470" y="162" width="180" height="60" fill="#ffffff" stroke="#3366cc" stroke-width="1" rx="5" ry="5"/>
  <text x="560" y="182" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Variational Bottleneck</text>
  <text x="560" y="200" text-anchor="middle" font-family="Arial" font-size="11">μ and log σ² heads from</text>
  <text x="560" y="215" text-anchor="middle" font-family="Arial" font-size="11">final encoder layer</text>

  <!-- reparameterization -->
  <rect x="470" y="238" width="180" height="60" fill="#ffffff" stroke="#3366cc" stroke-width="1" rx="5" ry="5"/>
  <text x="560" y="258" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Reparameterization</text>
  <text x="560" y="276" text-anchor="middle" font-family="Arial" font-size="11">z = μ + σ · ε,  ε ~ N(0, I)</text>
  <text x="560" y="291" text-anchor="middle" font-family="Arial" font-size="11">enables gradient backprop</text>

  <!-- DECODER SECTION -->
  <rect x="700" y="120" width="220" height="200" fill="#e6ffe6" stroke="#339933" stroke-width="2" rx="8" ry="8"/>
  <text x="810" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#339933">Decoder</text>

  <!-- MLP decoder -->
  <rect x="720" y="162" width="180" height="60" fill="#ffffff" stroke="#339933" stroke-width="1" rx="5" ry="5"/>
  <text x="810" y="182" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">MLP Decoder Layers</text>
  <text x="810" y="200" text-anchor="middle" font-family="Arial" font-size="11">Stacked linear layers with</text>
  <text x="810" y="215" text-anchor="middle" font-family="Arial" font-size="11">batch norm + ReLU activations</text>

  <!-- ELBO -->
  <rect x="720" y="238" width="180" height="60" fill="#ffffff" stroke="#339933" stroke-width="1" rx="5" ry="5"/>
  <text x="810" y="258" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">ELBO Training Objective</text>
  <text x="810" y="276" text-anchor="middle" font-family="Arial" font-size="11">Reconstruction loss +</text>
  <text x="810" y="291" text-anchor="middle" font-family="Arial" font-size="11">KL divergence regularisation</text>

  <!-- Output label -->
  <text x="1000" y="190" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#0066cc">Synthetic Flight Data</text>

  <!-- Arrows -->
  <!-- Input to preprocessing -->
  <line x1="190" y1="200" x2="225" y2="200" stroke="#555555" stroke-width="2"/>
  <polygon points="220,195 230,200 220,205" fill="#555555"/>

  <!-- Within preprocessing -->
  <line x1="320" y1="222" x2="320" y2="242" stroke="#cc7700" stroke-width="2"/>
  <polygon points="315,238 320,248 325,238" fill="#cc7700"/>

  <!-- Preprocessing to latent -->
  <line x1="420" y1="218" x2="455" y2="218" stroke="#555555" stroke-width="2"/>
  <polygon points="450,213 460,218 450,223" fill="#555555"/>

  <!-- Within latent -->
  <line x1="560" y1="222" x2="560" y2="242" stroke="#3366cc" stroke-width="2"/>
  <polygon points="555,238 560,248 565,238" fill="#3366cc"/>

  <!-- Latent to decoder -->
  <line x1="670" y1="268" x2="725" y2="268" stroke="#555555" stroke-width="2"/>
  <polygon points="720,263 730,268 720,273" fill="#555555"/>

  <!-- Within decoder -->
  <line x1="810" y1="222" x2="810" y2="242" stroke="#339933" stroke-width="2"/>
  <polygon points="805,238 810,248 815,238" fill="#339933"/>

  <!-- Decoder to output -->
  <line x1="920" y1="200" x2="950" y2="200" stroke="#555555" stroke-width="2"/>
  <polygon points="945,195 955,200 945,205" fill="#555555"/>

</svg>
